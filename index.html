<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Визиты ТП</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Roboto, Arial, sans-serif; font-size: 15px;
    background: var(--tg-theme-secondary-bg-color, #f0f2f5); color: var(--tg-theme-text-color, #111); }
  #app { padding: 10px; padding-bottom: 40px; }
  .card { background: var(--tg-theme-bg-color, #fff); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .muted { color: var(--tg-theme-hint-color, #888); font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .stat { text-align: center; flex: 1; }
  .stat b { display: block; font-size: 20px; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; margin-top: 8px;
    background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  button.sec { background: transparent; color: var(--tg-theme-link-color, #2481cc); border: 1px solid var(--tg-theme-link-color, #2481cc); }
  button:disabled { opacity: .45; }
  input[type=text] { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #ccc; font-size: 15px; margin-bottom: 10px;
    background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  .pt { background: var(--tg-theme-bg-color, #fff); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .pt.done { opacity: .55; }
  .pt .n { font-weight: 600; }
  .ok { color: #1a8f3c; } .bad { color: #d63b3b; } .warn { color: #c98a00; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 10; }
  #sheet.hidden { display: none; }
  #panel { background: var(--tg-theme-bg-color, #fff); width: 100%; border-radius: 16px 16px 0 0; padding: 16px; max-height: 92vh; overflow: auto; }
  #preview { width: 100%; border-radius: 10px; margin-top: 8px; display: none; }
  #msg { margin-top: 10px; white-space: pre-line; }
</style>
</head>
<body>
<div id="app">
  <div class="card" id="who">Загрузка…</div>
  <div class="card row" id="stats" style="display:none"></div>
  <div class="card">
    <div id="gpsText">📡 Определяем местоположение…</div>
    <button class="sec" id="btnGps">🔄 Обновить локацию</button>
  </div>
  <input type="text" id="search" placeholder="🔍 Поиск точки по названию или коду">
  <div id="list"></div>
</div>

<div id="sheet" class="hidden">
  <div id="panel">
    <div id="pTitle" class="n" style="font-size:17px;font-weight:600"></div>
    <div id="pInfo" class="muted"></div>
    <div id="pDist" style="margin-top:8px"></div>
    <button class="sec" id="btnPhoto">📷 Сфотографировать точку</button>
    <img id="preview" alt="">
    <button id="btnSend" disabled>✅ Отметить визит</button>
    <button class="sec" id="btnClose">Отмена</button>
    <div id="msg"></div>
  </div>
</div>
<input type="file" id="photo" accept="image/*" capture="environment" style="display:none">

<script>
/* ===== Адрес сервера приходит в ссылке (?api=…) — бот берёт его с листа «Настройки». Этот файл НЕ нужно править ни для какого региона ===== */
var API_URL = new URLSearchParams(location.search).get('api') || '';
if (!API_URL) alert('Не задан адрес сервера. Откройте приложение через кнопку в боте.');
/* ========================================================================================= */

var tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
var S = { points: [], rules: {}, pos: null, src: '', sel: null, photo: null, photoTs: 0, busy: false, lastRenderPos: null, watchId: null };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function api(data) {
  data.initData = tg.initData;
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(data) }).then(function (r) { return r.json(); });
}
function dist(lat1, lon1, lat2, lon2) {
  var R = 6371000, k = Math.PI / 180, dLat = (lat2 - lat1) * k, dLon = (lon2 - lon1) * k;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * k) * Math.cos(lat2 * k) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function fmtDist(m) { return m < 1000 ? Math.round(m) + ' м' : (m / 1000).toFixed(1) + ' км'; }
function hasCoords(p) { return p.lat !== null && p.lat !== '' && p.lon !== null && p.lon !== ''; }

/* ---------- запуск ---------- */
function init() {
  if (!tg.initData) { $('who').innerHTML = '⚠️ Откройте приложение через кнопку «Отметить визит» в боте Telegram.'; return; }
  api({ action: 'init' }).then(function (r) {
    if (!r.ok) { $('who').innerHTML = '⛔ ' + esc(r.error); return; }
    S.points = r.points; S.rules = r.rules;
    if (!r.rules.allowDesktop && ['android', 'ios'].indexOf(tg.platform) < 0) {
      $('who').innerHTML = '📱 Отметка визитов возможна только с телефона.'; return;
    }
    $('who').innerHTML = '👤 <b>' + esc(r.agent.name) + '</b><div class="muted">' + esc(r.agent.routes.join('; ')) + '</div>';
    renderStats(r.stats);
    render();
    startGps();
  }).catch(function (e) { $('who').innerHTML = '❌ Нет связи с сервером: ' + esc(e.message); });
}

function renderStats(s) {
  if (!s) return;
  $('stats').style.display = 'flex';
  $('stats').innerHTML =
    '<div class="stat"><b>' + s.plan + '</b><span class="muted">план</span></div>' +
    '<div class="stat"><b>' + s.fact + '</b><span class="muted">факт</span></div>' +
    '<div class="stat"><b class="' + (s.pct >= 100 ? 'ok' : (s.pct >= 80 ? 'warn' : 'bad')) + '">' + s.pct + '%</b><span class="muted">выполнение</span></div>' +
    '<div class="stat"><b>' + s.today + '</b><span class="muted">сегодня</span></div>';
}

/* ---------- геолокация ---------- */
function startGps() {
  if (!navigator.geolocation) { tgLocation(); return; }
  if (S.watchId !== null) navigator.geolocation.clearWatch(S.watchId);
  $('gpsText').innerHTML = '📡 Определяем местоположение…';
  S.watchId = navigator.geolocation.watchPosition(function (p) {
    setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.timestamp || Date.now(), 'browser');
  }, function (err) {
    if (!S.pos) tgLocation(err);
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}

function tgLocation(err) {
  var LM = tg.LocationManager;
  if (!LM || !tg.isVersionAtLeast || !tg.isVersionAtLeast('8.0')) { gpsError(err); return; }
  LM.init(function () {
    if (!LM.isLocationAvailable) { gpsError(err); return; }
    LM.getLocation(function (d) {
      if (!d) {
        if (LM.isAccessRequested && !LM.isAccessGranted) {
          $('gpsText').innerHTML = '⛔ Доступ к геолокации запрещён. <a href="#" id="lmSet">Открыть настройки</a>';
          $('lmSet').onclick = function () { LM.openSettings(); return false; };
        } else gpsError(err);
        return;
      }
      setPos(d.latitude, d.longitude, d.horizontal_accuracy || 9999, Date.now(), 'telegram');
    });
  });
}

function gpsError(err) {
  $('gpsText').innerHTML = '<span class="bad">❌ Нет геолокации.</span><div class="muted">Включите GPS на телефоне и разрешите Telegram доступ к местоположению, затем нажмите «Обновить локацию».' + (err && err.message ? '<br>(' + esc(err.message) + ')' : '') + '</div>';
}

function setPos(lat, lon, acc, ts, src) {
  S.pos = { lat: lat, lon: lon, acc: acc, ts: ts }; S.src = src;
  var good = acc <= (S.rules.maxAcc || 100);
  $('gpsText').innerHTML = '📍 Точность GPS: <b class="' + (good ? 'ok' : 'bad') + '">±' + Math.round(acc) + ' м</b>' +
    (good ? '' : '<div class="muted">Слабый сигнал — выйдите ближе к улице/окну и подождите.</div>');
  if (!S.lastRenderPos || dist(lat, lon, S.lastRenderPos.lat, S.lastRenderPos.lon) > 15) { S.lastRenderPos = { lat: lat, lon: lon }; render(); }
  if (S.sel) updatePanel();
}

function freshPos() {
  return new Promise(function (resolve, reject) {
    if (S.src === 'telegram') {
      tg.LocationManager.getLocation(function (d) {
        if (!d) return reject(new Error('Нет геолокации'));
        setPos(d.latitude, d.longitude, d.horizontal_accuracy || 9999, Date.now(), 'telegram'); resolve(S.pos);
      });
      return;
    }
    navigator.geolocation.getCurrentPosition(function (p) {
      setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.timestamp || Date.now(), 'browser'); resolve(S.pos);
    }, function (e) { reject(new Error('Не удалось получить геолокацию: ' + e.message)); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  });
}

/* ---------- список точек ---------- */
function render() {
  var q = $('search').value.trim().toLowerCase();
  var arr = S.points.filter(function (p) { return !q || (p.name + ' ' + p.code + ' ' + p.id + ' ' + p.route).toLowerCase().indexOf(q) >= 0; });
  arr.forEach(function (p) { p._d = (S.pos && hasCoords(p)) ? dist(S.pos.lat, S.pos.lon, Number(p.lat), Number(p.lon)) : null; });
  arr.sort(function (a, b) {
    if (a._d === null && b._d === null) return 0;
    if (a._d === null) return 1;
    if (b._d === null) return -1;
    return a._d - b._d;
  });
  var html = arr.slice(0, 80).map(function (p) {
    var d = p._d === null ? '<span class="muted">нет координат — запишутся при первом визите</span>'
      : '<span class="' + (p._d <= p.radius ? 'ok' : 'muted') + '">' + fmtDist(p._d) + '</span>';
    return '<div class="pt' + (p.visited ? ' done' : '') + '" data-id="' + esc(p.id) + '">' +
      '<div class="n">' + (p.visited ? '✅ ' : '') + esc(p.name) + '</div>' +
      '<div class="row muted"><span>' + esc(p.code) + ' · ' + esc(p.route) + '</span>' + d + '</div>' +
      (p.visited ? '<div class="muted">отмечено сегодня в ' + esc(String(p.visited).slice(0, 5)) + '</div>' : '') + '</div>';
  }).join('');
  $('list').innerHTML = html || '<div class="card muted">Ничего не найдено</div>';
}

/* ---------- карточка визита ---------- */
function openPoint(id) {
  var p = S.points.filter(function (x) { return x.id === id; })[0];
  if (!p) return;
  if (p.visited) { tg.showAlert('Эта точка уже отмечена сегодня.'); return; }
  S.sel = p; S.photo = null; S.photoTs = 0;
  $('pTitle').textContent = p.name;
  $('pInfo').textContent = p.code + ' · ' + p.route + ' · ' + p.district;
  $('preview').style.display = 'none';
  $('msg').textContent = '';
  $('btnPhoto').style.display = S.rules.photo ? 'block' : 'none';
  $('sheet').classList.remove('hidden');
  updatePanel();
}

function updatePanel() {
  var p = S.sel, t = '';
  if (!S.pos) t = '<span class="bad">Нет геолокации</span>';
  else if (!hasCoords(p)) t = '<span class="warn">ℹ️ У точки ещё нет координат — будут записаны по вашему местоположению. Отмечайте, только находясь в точке!</span>';
  else {
    var d = dist(S.pos.lat, S.pos.lon, Number(p.lat), Number(p.lon));
    t = d <= p.radius ? '<span class="ok">✅ Вы в точке (' + fmtDist(d) + ')</span>'
      : '<span class="bad">❌ Вы далеко от точки: ' + fmtDist(d) + ' (нужно ближе ' + p.radius + ' м)</span>';
  }
  $('pDist').innerHTML = t;
  var ready = S.pos && S.pos.acc <= S.rules.maxAcc && (!S.rules.photo || S.photo);
  $('btnSend').disabled = !ready || S.busy;
}

function closePanel() { $('sheet').classList.add('hidden'); S.sel = null; }

/* ---------- фото: только камера, сжатие + штамп даты ---------- */
function compress(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      var g = c.getContext('2d');
      g.drawImage(img, 0, 0, c.width, c.height);
      var stamp = new Date().toLocaleString('ru-RU') + (S.pos ? '  ' + S.pos.lat.toFixed(5) + ', ' + S.pos.lon.toFixed(5) : '');
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - 34, c.width, 34);
      g.fillStyle = '#fff'; g.font = '18px Arial'; g.fillText(stamp + '  ' + (S.sel ? S.sel.name : ''), 10, c.height - 11);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = function () { reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}

$('photo').addEventListener('change', function () {
  var f = this.files && this.files[0];
  this.value = '';
  if (!f) return;
  var age = Math.abs(Date.now() - (f.lastModified || 0)) / 1000;
  if (f.lastModified && age > S.rules.maxPhotoAge) {
    tg.showAlert('Фото старое или из галереи. Сделайте новое фото камерой прямо сейчас.');
    return;
  }
  compress(f).then(function (data) {
    S.photo = data; S.photoTs = f.lastModified || 0;
    $('preview').src = data; $('preview').style.display = 'block';
    updatePanel();
  }).catch(function (e) { tg.showAlert(e.message); });
});

/* ---------- отправка визита ---------- */
function sendVisit() {
  if (S.busy || !S.sel) return;
  S.busy = true; updatePanel();
  $('msg').innerHTML = '⏳ Проверяем местоположение…';
  var p = S.sel;
  freshPos().then(function (pos) {
    if (pos.acc > S.rules.maxAcc) throw new Error('Слабый GPS (±' + Math.round(pos.acc) + ' м). Подождите несколько секунд и попробуйте снова.');
    $('msg').innerHTML = '⏳ Отправляем…';
    return api({ action: 'visit', pointId: p.id, lat: pos.lat, lon: pos.lon, acc: pos.acc, gpsTs: pos.ts,
      platform: tg.platform, src: S.src, photo: S.photo, photoTs: S.photoTs });
  }).then(function (r) {
    S.busy = false;
    if (r.ok) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      p.visited = r.time || 'сейчас';
      if (!hasCoords(p) && S.pos && r.status === 'OK') { p.lat = S.pos.lat; p.lon = S.pos.lon; }
      closePanel(); render();
      tg.showAlert(r.status === 'OK' ? '✅ Визит засчитан!' : '⚠️ Визит принят, но отправлен на проверку менеджеру:\n' + (r.warnings || []).join('\n'));
    } else {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      $('msg').innerHTML = '<span class="bad">⛔ Визит не засчитан:\n' + esc(r.error) + '</span>';
      updatePanel();
    }
  }).catch(function (e) {
    S.busy = false; updatePanel();
    $('msg').innerHTML = '<span class="bad">❌ ' + esc(e.message) + '</span>';
  });
}

/* ---------- события ---------- */
$('btnGps').onclick = startGps;
$('search').oninput = render;
$('list').onclick = function (e) { var el = e.target.closest('.pt'); if (el) openPoint(el.getAttribute('data-id')); };
$('btnPhoto').onclick = function () { $('photo').click(); };
$('btnSend').onclick = sendVisit;
$('btnClose').onclick = closePanel;
$('sheet').onclick = function (e) { if (e.target.id === 'sheet') closePanel(); };

init();
</script>
</body>
</html>
